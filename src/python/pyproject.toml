[build-system]
# setuptools>=77.0.0 is required for PEP 639 license-file support at
# Metadata-Version 2.4; older setuptools writes a License-File field while
# still declaring Metadata-Version 2.1, which PyPI/Kitmaker's Warehouse
# validation rejects ("license-file introduced in metadata version 2.4,
# not 2.1"). Matches the pin in core/pyproject.toml. See TRI-1775.
requires = ["setuptools==77.0.1", "wheel==0.44.0"]
build-backend = "setuptools.build_meta"
