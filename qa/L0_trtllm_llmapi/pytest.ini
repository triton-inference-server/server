# Default options for every L0_trtllm_llmapi scenario, whether run through
# pytest.py or with pytest directly in a scenario directory. pytest.py adds the
# per-run paths (JUnit report, log file, cache) under the output directory.
[pytest]
addopts = -v -s -rs
# The test log goes to the console as it is written, as well as to the log
# file; the console gets INFO and above, the file everything.
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)s %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
log_file_level = DEBUG
log_file_format = %(asctime)s %(levelname)s %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
