[pytest]
# The test cases are named testcase<N>.py, which pytest does not collect
# under its default python_files pattern (test_*.py / *_test.py).
python_files = testcase*.py
testpaths = tests
# -s keeps sub-action output (git clone, go install, gen_go_stubs.sh, the
# server and client logs) streaming into the job log, as it did under
# `bash -ex ./test.sh`. Without it pytest captures fixture output and only
# replays it on failure. -ra summarises every non-passing outcome.
addopts = -v -s -ra
